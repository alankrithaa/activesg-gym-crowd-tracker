name: Scrape ActiveSG Gym Crowds (6-Day Run)

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activesg-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pandas pytz playwright

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run ActiveSG scraper
        run: python scraper.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add activesg_gym_crowds.csv scrape_start_timestamp.txt
          if ! git diff --staged --quiet; then
            git commit -m "Log ActiveSG gym crowd snapshot"
            git pull --rebase origin main
            git push
          else
            echo "No new changes to commit."
          fi